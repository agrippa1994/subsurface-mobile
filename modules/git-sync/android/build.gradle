plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.gitsync'
version = '1.0.0'

android {
  namespace "expo.modules.gitsync"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"

    externalNativeBuild {
      cmake {
        // React Native links libc++ as a shared library; every native
        // library in the app has to use the same one.
        arguments "-DANDROID_STL=c++_shared"
        cppFlags "-fexceptions", "-frtti"
      }
    }
    ndk {
      // The ABIs android/vendor/build/build-libgit2.sh builds for.
      abiFilters "arm64-v8a", "x86_64"
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  lintOptions {
    abortOnError false
  }
}
