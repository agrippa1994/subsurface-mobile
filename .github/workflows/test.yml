# AI-generated (Claude)
# Runs the TypeScript checks and the vitest suite.
#
# macOS, because the golden tests drive the real C++ bindings: the suite builds
# modules/ssrf-core for the host (see modules/ssrf-core/scripts/build-host.sh),
# which needs the Xcode command line tools for the SDK's libxml2/libxslt/sqlite3.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # The fixtures are the pinned upstream logbooks in subsurface/dives.
          submodules: recursive

      # Dependencies are locked with bun (bun.lock). Node is still needed:
      # build-host.sh runs scripts/vendor-core.mjs with node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run test
